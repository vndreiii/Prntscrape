[package]
name = "prntscrape"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/vndreiii/Prntscrape"

[dependencies]
chrono = "0.4"
directories = "5"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = { version = "4", default-features = false, features = ["d"] }
tray-icon = { version = "0.17", default-features = false }
wry = "0.55"
tao = "0.35"
rfd = "0.14"
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }

[target.'cfg(any(target_os="windows", target_os="macos"))'.dependencies]
xcap = "0.9.6"

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

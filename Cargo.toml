[package]
name = "prntscrape"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
directories = "5"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = { version = "4", default-features = false, features = ["d"] }
xcap = "0.9.6"
tray-icon = "0.17"
wry = "0.55"
tao = "0.35"
rfd = "0.14"

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

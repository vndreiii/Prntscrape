<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { padding: 10px; background: #f6f6f6; color: #171717; font: 14px "Segoe UI Variable", "Segoe UI", sans-serif; }
.card { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; background: #fff; border: 1px solid #e4e4e4; border-radius: 12px; }
.brand { display: flex; align-items: center; gap: 9px; }
.logo { width: 34px; height: 34px; padding: 3px; object-fit: contain; background: #fff; border: 1px solid #eee; border-radius: 8px; }
.brand-name { font-size: 14px; font-weight: 650; letter-spacing: .1px; }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid #e6e6e6; border-radius: 99px; color: #444; font-size: 11px; }
.dot { width: 7px; height: 7px; background: #171717; border-radius: 50%; }
.paused .dot { background: #888; }
.content { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 43px; }
.message { color: #5b5b5b; font-size: 12px; line-height: 1.35; }
button { font: inherit; cursor: pointer; }
#open { flex: 0 0 auto; padding: 8px 12px; color: #fff; background: #171717; border: 0; border-radius: 7px; font-size: 12px; font-weight: 600; }
#open:hover { background: #333; }
#close { position: absolute; top: 13px; right: 14px; padding: 0 2px; border: 0; background: transparent; color: #777; font-size: 19px; line-height: 20px; }
#close:hover { color: #111; }
@media (prefers-color-scheme: dark) {
  body { background: #181818; color: #f4f4f4; }
  .card { background: #242424; border-color: #393939; }
  .logo { border-color: #454545; }
  .state { color: #ddd; border-color: #454545; }
  .dot { background: #f4f4f4; }
  .paused .dot { background: #999; }
  .message { color: #aaa; }
  #open { color: #111; background: #f4f4f4; }
  #open:hover { background: #ddd; }
  #close { color: #aaa; }
  #close:hover { color: #fff; }
}
</style>
</head>
<body>
<main class="card {{STATE_CLASS}}">
  <header class="brand">
    <img class="logo" src="{{LOGO_DATA}}" alt="">
    <span class="brand-name">Prntscrape</span>
    <span class="state"><i class="dot"></i>{{STATUS}}</span>
  </header>
  <section class="content">
    <span class="message">{{MESSAGE}}</span>
    <button id="open" onclick="window.ipc.postMessage('settings')">Open settings</button>
  </section>
  <button id="close" aria-label="Dismiss notification" onclick="window.ipc.postMessage('dismiss')">×</button>
</main>
<script>
window.addEventListener('load', () => window.ipc.postMessage('ready'), { once: true });
</script>
</body>
</html>
